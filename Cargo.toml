[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "crates/planner",
    "crates/browser",
    "crates/voice",
    "crates/guardrails",
    "crates/evals",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
neuralnav-core = { path = "crates/core" }
neuralnav-planner = { path = "crates/planner" }
neuralnav-browser = { path = "crates/browser" }
neuralnav-voice = { path = "crates/voice" }
neuralnav-guardrails = { path = "crates/guardrails" }
neuralnav-evals = { path = "crates/evals" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
